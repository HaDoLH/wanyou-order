<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- viewport：讓平板/手機正確縮放，現場操作必備 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>萬友咖啡 · 台中咖啡展點單</title>

  <!-- PWA：讓平板能「加到主畫面」、離線開啟 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#394253" />
  <link rel="apple-touch-icon" href="images/icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="萬友點單" />

  <!-- Noto Serif TC 襯線標題字（有網路時用；離線自動回退系統襯線） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet" />

  <!-- 樣式表。改 CSS 後把 ?v= 數字加一，強迫瀏覽器抓新版（破快取） -->
  <link rel="stylesheet" href="style.css?v=12" />
</head>
<body>

  <!-- ============ 頂部標題列 ============ -->
  <header class="header">
    <!-- 萬友 WY 圓形 logo（用無空格檔名 icon.png，避免上線後中文檔名出狀況） -->
    <img class="logo" src="images/icon.png" alt="萬友咖啡 logo" onerror="this.style.display='none'" />
    <div>
      <h1>萬友咖啡 · 台中咖啡展</h1>
      <div class="subtitle">現場點單系統</div>
    </div>
  </header>

  <!-- 狀態列：純本機模式（資料存在這台平板，免網路） -->
  <div id="statusBar" class="status-bar local">
    <span class="dot"></span>
    <span id="statusText">本機模式：資料存在這台平板（免網路）</span>
  </div>

  <!-- ============ 管理工具列 ============ -->
  <div class="toolbar">
    <div class="toolbar-stats">
      <!-- 第一行：訂單筆數 / 贈品 / 營收 -->
      <div id="toolbarStats">訂單 0 筆 · 營收 $0</div>
      <!-- 第二行：各付款方式收多少（只顯示有金額的） -->
      <div id="payStats" class="pay-stats">尚無收款</div>
    </div>
    <div class="toolbar-actions">
      <button class="btn-sm" id="restockBtn">補貨</button>
      <button class="btn-sm" id="ordersBtn">訂單紀錄</button>
      <button class="btn-sm" id="importBtn">匯入商品</button>
      <button class="btn-sm" id="exportBtn">匯出 CSV</button>
      <button class="btn-sm danger-text" id="newDayBtn">開新的一天</button>
      <!-- 匯入商品用的隱藏檔案選擇器 -->
      <input type="file" id="importFile" accept=".csv,text/csv" hidden />
    </div>
  </div>

  <!-- ============ 主版面：左商品 + 右購物車 ============ -->
  <div class="layout">

    <!-- 左側：分類頁籤 + 商品卡片 -->
    <main>
      <div class="tabs" id="tabs">
        <button class="tab active" data-cat="beans">生豆</button>
        <button class="tab" data-cat="gift">贈品</button>
      </div>
      <div class="products" id="products">
        <!-- 商品卡片由 JS 動態產生 -->
      </div>
    </main>

    <!-- 右側：購物車面板 -->
    <aside class="cart collapsed" id="cart">
      <h2>
        本筆訂單
        <!-- 手機版收合時，這裡顯示「件數＋總額」迷你摘要 -->
        <span class="cart-mini" id="cartMini">0 件　$0</span>
        <!-- 手機版才會出現的展開/收合鈕 -->
        <button class="cart-toggle" id="cartToggle">展開明細</button>
      </h2>
      <div class="cart-body" id="cartBody">
        <div id="cartLines">
          <div class="cart-empty">尚未選擇商品<br>點左側「＋」開始點單</div>
        </div>
        <div class="cart-total">
          <span class="label">合計</span>
          <span class="amount" id="cartTotal">$0</span>
        </div>
        <div class="cart-actions">
          <button class="btn danger" id="clearBtn">清空</button>
          <button class="btn primary" id="checkoutBtn">結帳確認</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- ============ 結帳確認彈窗 ============ -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>結帳確認</h2>
      <div class="modal-sub">請與客人確認以下品項與金額</div>
      <div id="modalLines"><!-- 明細由 JS 產生 --></div>
      <div class="modal-total">
        <div class="mt-left">
          <span class="label">應收總額</span>
          <!-- 有折扣時才顯示：原價 $XXX（劃掉樣式） -->
          <span class="mt-orig" id="modalTotalOrig" hidden></span>
        </div>
        <span class="amount" id="modalTotal">$0</span>
      </div>

      <!-- ===== POS 區：只有「應收 > 0」時才顯示（純贈品訂單會隱藏） ===== -->
      <div id="posBox">
        <!-- 付款方式 -->
        <div class="pos-row">
          <span class="pos-label">付款方式</span>
          <div class="pay-toggle" id="payToggle">
            <button class="pay-btn active" data-pay="付現">付現</button>
            <button class="pay-btn" data-pay="刷卡">刷卡</button>
            <button class="pay-btn" data-pay="LINE Pay">LINE Pay</button>
            <button class="pay-btn" data-pay="匯款">匯款</button>
          </div>
        </div>

        <!-- 折扣：自行輸入要折抵的金額，應收總額會即時扣掉（各付款方式都適用） -->
        <div class="pos-row discount-row">
          <label class="pos-label" for="discountInput">折扣</label>
          <input type="number" id="discountInput" inputmode="numeric" min="0" placeholder="折扣金額" />
          <span class="discount-out" id="discountOut">−$0</span>
        </div>

        <!-- 找零計算（選付現時才顯示） -->
        <div class="change-row" id="changeRow">
          <label class="pos-label" for="cashGiven">收現</label>
          <input type="number" id="cashGiven" inputmode="numeric" min="0" placeholder="客人給的金額" />
          <span class="change-out" id="changeDue">找零 $0</span>
        </div>

        <!-- 發票 -->
        <div class="pos-row">
          <label class="invoice-toggle"><input type="checkbox" id="invoiceOn" /> 開發票</label>
        </div>
        <div class="invoice-box" id="invoiceBox" hidden>
          <div class="inv-field">
            <label for="invPrefix">前段（固定）</label>
            <input type="text" id="invPrefix" placeholder="例 AB-" />
          </div>
          <div class="inv-field">
            <label for="invNo">後段（號碼）</label>
            <input type="text" id="invNo" inputmode="numeric" placeholder="00000001" />
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn secondary" id="modalCancel">返回修改</button>
        <button class="btn primary" id="modalConfirm">完成並送出</button>
      </div>
    </div>
  </div>

  <!-- ============ 贈品「發放原因」選擇彈窗 ============ -->
  <div class="overlay" id="reasonOverlay">
    <div class="modal modal-reason">
      <h2>選擇贈送原因</h2>
      <div class="modal-sub" id="reasonProductName">—</div>
      <div class="reason-options" id="reasonOptions">
        <button class="btn reason-btn" data-reason="公關贈送">公關贈送</button>
        <button class="btn reason-btn" data-reason="滿額贈">滿額贈</button>
        <button class="btn reason-btn" data-reason="扭蛋獎品">扭蛋獎品</button>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="reasonCancel">取消</button>
      </div>
    </div>
  </div>

  <!-- ============ 補貨彈窗 ============ -->
  <div class="overlay" id="restockOverlay">
    <div class="modal modal-restock">
      <h2>補貨</h2>
      <div class="modal-sub">輸入每項要「增加」的數量（不填或 0 表示不變）</div>
      <div id="restockList"><!-- 清單由 JS 產生 --></div>
      <div class="modal-actions">
        <button class="btn secondary" id="restockCancel">取消</button>
        <button class="btn primary" id="restockConfirm">確認補貨</button>
      </div>
    </div>
  </div>

  <!-- ============ 庫存修改彈窗（展場商品庫存表）============ -->
  <div class="overlay" id="stockEditOverlay">
    <div class="modal modal-restock">
      <h2>展場商品庫存表</h2>
      <div class="modal-sub">直接把「目前庫存」改成正確數量，並填寫調整原因</div>
      <!-- 調整原因（這批修改共用一個原因） -->
      <div class="se-reason">
        <label for="stockEditReason">調整原因</label>
        <input type="text" id="stockEditReason" placeholder="例：盤點更正／破損／內部取用" />
      </div>
      <div id="stockEditList"><!-- 商品清單由 JS 產生 --></div>
      <div class="modal-actions">
        <button class="btn secondary" id="stockEditCancel">取消</button>
        <button class="btn primary" id="stockEditConfirm">確認修改</button>
      </div>
    </div>
  </div>

  <!-- ============ 訂單紀錄彈窗（查看 / 改付款 / 刪除）============ -->
  <div class="overlay" id="ordersOverlay">
    <div class="modal modal-orders">
      <h2>訂單紀錄</h2>
      <div class="modal-sub">點單後如需更正，可在這裡改付款方式或刪除整筆訂單</div>
      <!-- 各付款方式小計 -->
      <div class="orders-summary" id="ordersSummary"><!-- 由 JS 產生 --></div>
      <!-- 訂單清單（最新在最上面） -->
      <div id="ordersList"><!-- 由 JS 產生 --></div>
      <div class="modal-actions">
        <button class="btn secondary" id="ordersClose">關閉</button>
      </div>
    </div>
  </div>

  <!-- ============ 修改付款方式彈窗 ============ -->
  <div class="overlay" id="payEditOverlay">
    <div class="modal modal-reason">
      <h2>修改付款方式</h2>
      <div class="modal-sub" id="payEditInfo">—</div>
      <div class="reason-options" id="payEditOptions">
        <button class="btn reason-btn" data-pay="付現">付現</button>
        <button class="btn reason-btn" data-pay="刷卡">刷卡</button>
        <button class="btn reason-btn" data-pay="LINE Pay">LINE Pay</button>
        <button class="btn reason-btn" data-pay="匯款">匯款</button>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="payEditCancel">取消</button>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <!-- ===================================================================
       JavaScript：純本機點單系統（資料存 localStorage，免網路）
       全部寫在這裡，沒有外部套件，看得懂每一行。
       =================================================================== -->
  <script>
  /* ============================================================
     ① 設定區（你之後主要會動的地方）
     ============================================================ */

  // 贈送原因（贈品用）。※ 目前實際按鈕寫在下方 HTML 的 #reasonOptions，
  //   這份常數僅作對照參考；如要增減原因，兩邊要一起改才會生效。
  const GIFT_REASONS = ['公關贈送', '滿額贈', '扭蛋獎品'];

  // 付款方式（結帳按鈕、付款總額、改付款方式都用這份；要加減方式改這裡）
  const PAYMENT_METHODS = ['付現', '刷卡', 'LINE Pay', '匯款'];

  // 第一次啟動用的「種子商品」。之後商品以平板裡的存檔（localStorage）為準，
  // 要換商品有兩個方法：①改這份種子後按「開新的一天」重置 ②用「匯入商品」讀 CSV。
  //   cat:'beans' = 生豆（販售）；cat:'gift' = 贈品（價格 0、用「發放」記錄）
  const DEFAULT_PRODUCTS = [
    // 2026 台中咖啡展 · 一公斤販售（1公斤真空／包）
    { id:'21080445', cat:'beans', name:'衣索比亞 神燈系列 谷吉 香妃 水洗 G1',        price:500,  unit:'包', stock:60, lowAt:10 },
    { id:'21080462', cat:'beans', name:'衣索比亞 西達馬 班莎 聖塔維 水洗 G1',        price:500,  unit:'包', stock:60, lowAt:10 },
    { id:'21080461', cat:'beans', name:'衣索比亞 谷吉 姬格薩處理廠 水洗 G1',         price:500,  unit:'包', stock:60, lowAt:10 },
    { id:'21040851', cat:'beans', name:'巴拿馬 微光秘密系列 愛德華 小農藝妓 水洗 SHB EP', price:890,  unit:'包', stock:90, lowAt:10 },
    // 高價單賣商品（500公克／包）
    { id:'21090155', cat:'beans', name:'夏威夷 坎西諾農場 可那 Fancy 水洗',           price:1350, unit:'包', stock:10, lowAt:3 },
    { id:'21070942', cat:'beans', name:'巴拿馬 CCD計畫 Los Pozos 小農藝妓 日曬 Lot1', price:900,  unit:'包', stock:10, lowAt:3 },
    { id:'21070943', cat:'beans', name:'巴拿馬 CCD計畫 Los Pozos 小農藝妓 日曬 Lot2', price:870,  unit:'包', stock:10, lowAt:3 },
    { id:'21090153', cat:'beans', name:'玻利維亞 伊莎貝爾莊園 羅沙里歐 藝妓 水洗',     price:1000, unit:'包', stock:10, lowAt:3 },
    // 贈品（發放時再選原因：公關贈送／滿額贈／扭蛋獎品，共用同一份庫存）
    { id:'g1', cat:'gift', name:'咖啡生豆 香妃 G1（贈品）', price:0, unit:'包', stock:4,  lowAt:1 },
    { id:'g2', cat:'gift', name:'咖啡品飲杯',               price:0, unit:'個', stock:50, lowAt:5 },
    { id:'g3', cat:'gift', name:'杯墊',                     price:0, unit:'個', stock:50, lowAt:5 },
    { id:'g4', cat:'gift', name:'杜邦紙購物袋',             price:0, unit:'個', stock:33, lowAt:3 },
  ];

  // localStorage 的鍵名（資料就存在這幾個「抽屜」裡）
  const KEY_PRODUCTS = 'wy_products';        // 商品＋庫存總量
  const KEY_SALES    = 'wy_sales';           // 銷售紀錄（每行一筆）
  const KEY_INV_PREFIX = 'wy_invoice_prefix';// 發票前段（記住上次）
  const KEY_INV_NO     = 'wy_invoice_no';    // 發票下一個後段號碼（含前導 0）
  const KEY_ADJUST     = 'wy_adjust';        // 庫存調整紀錄（現場修改庫存＋原因）

  /* ============================================================
     ② 程式狀態（資料）—— 改資料 → 存檔 → 重畫畫面
     ============================================================ */
  let products = [];        // 目前所有商品（含 remaining 即時剩餘）
  let sales = [];           // 本機銷售紀錄陣列
  let adjustments = [];     // 庫存調整紀錄（現場改庫存＋原因，用於對帳）
  // 購物車：key = 「行」的唯一鍵，value = { id, qty, reason }
  //   生豆：key = id，          reason = '銷售'
  //   贈品：key = id + '|' + 原因，reason = 公關贈送 / 滿額贈 / 扭蛋獎品
  let cart = {};
  let currentCat = 'beans';
  let pendingGiftId = null;       // 暫存：正在選原因的贈品 id
  let selectedPayment = '付現';   // 結帳時選的付款方式（付現/刷卡）

  const $ = (sel) => document.querySelector(sel);
  const productsEl = $('#products');
  const cartLinesEl = $('#cartLines');
  const cartTotalEl = $('#cartTotal');

  /* ============================================================
     ③ 本機存取（localStorage）—— 像平板裡的小抽屜
     ============================================================ */
  function loadProducts(){
    const saved = localStorage.getItem(KEY_PRODUCTS);
    if(saved){
      products = JSON.parse(saved);
    }else{
      // 第一次啟動：用種子商品，並存進抽屜
      products = DEFAULT_PRODUCTS.map(p => ({ ...p }));
      saveProducts();
    }
  }
  function saveProducts(){ localStorage.setItem(KEY_PRODUCTS, JSON.stringify(products)); }

  function loadSales(){
    const saved = localStorage.getItem(KEY_SALES);
    sales = saved ? JSON.parse(saved) : [];
  }
  function saveSales(){ localStorage.setItem(KEY_SALES, JSON.stringify(sales)); }

  function loadAdjustments(){
    const saved = localStorage.getItem(KEY_ADJUST);
    adjustments = saved ? JSON.parse(saved) : [];
  }
  function saveAdjustments(){ localStorage.setItem(KEY_ADJUST, JSON.stringify(adjustments)); }

  // 即時剩餘 = 庫存總量 − 該商品在銷售紀錄的數量加總（與舊雲端同邏輯，改在本機算）
  function recomputeRemaining(){
    const soldById = {};
    sales.forEach(s => { soldById[s.id] = (soldById[s.id] || 0) + Number(s.qty); });
    products.forEach(p => { p.remaining = Math.max(0, Number(p.stock) - (soldById[p.id] || 0)); });
  }

  /* ============================================================
     ④ 啟動
     ============================================================ */
  function init(){
    loadProducts();
    loadSales();
    loadAdjustments();
    recomputeRemaining();
    bindEvents();
    refresh();
    updateStats();
    registerServiceWorker();
  }

  /* ============================================================
     ⑤ 庫存判斷小工具
     ============================================================ */
  function isGift(p){ return p.cat === 'gift'; }

  // 取得某購物車行的顯示資訊：
  //   一般商品 → 去 products 表查名稱與價格
  //   預購（自訂金額）→ 直接用這行自己帶的名稱與金額（不占庫存）
  function lineInfo(line){
    if(line.custom) return { name:line.name, price:line.price, isGift:false, custom:true, product:null };
    const p = products.find(x => x.id === line.id);
    if(!p) return null;
    return { name:p.name, price:p.price, isGift:isGift(p), custom:false, product:p };
  }

  // 某商品目前在購物車的總數（贈品可能分散在多個原因行，要全部加起來）
  function qtyInCartById(id){
    return Object.values(cart).reduce((s, l) => s + (l.id === id ? l.qty : 0), 0);
  }
  // 還能再加幾個 = 剩餘 − 已在購物車的數量
  function availableStock(p){
    if(p.remaining === undefined || p.remaining === null) return Infinity;
    return p.remaining - qtyInCartById(p.id);
  }
  function isLow(p){
    if(p.remaining === undefined || p.remaining === null) return false;
    return p.remaining > 0 && p.remaining <= (p.lowAt ?? 5);
  }

  /* ============================================================
     ⑥ 畫面：商品卡片
     ============================================================ */
  function renderProducts(){
    const list = products.filter(p => p.cat === currentCat);
    productsEl.innerHTML = '';

    if(list.length === 0){
      productsEl.innerHTML = '<div class="cart-empty">此分類暫無商品</div>';
      return;
    }

    list.forEach(p => {
      const out = availableStock(p) <= 0;
      const inCart = qtyInCartById(p.id);

      let stockHtml = '';
      if(p.remaining !== undefined && p.remaining !== null){
        const unit = p.unit || (isGift(p) ? '個' : '');
        if(p.remaining <= 0)   stockHtml = `<div class="stock out">${isGift(p)?'已送完':'已售罄'}</div>`;
        else if(isLow(p))      stockHtml = `<div class="stock low">⚠ 剩 ${p.remaining} ${unit}</div>`;
        else                   stockHtml = `<div class="stock">剩 ${p.remaining} ${unit}</div>`;
      }

      let priceHtml, actionHtml;

      if(isGift(p)){
        priceHtml = `<div class="price gift-price">🎁 贈品</div>`;
        const badge = inCart > 0 ? `<div class="given-badge">已選 ${inCart} 個</div>` : '';
        actionHtml = badge + `<button class="btn primary" data-give="${p.id}" ${out?'disabled':''}>
                                ${out ? '已送完' : '＋ 發放'}
                              </button>`;
      }else{
        priceHtml = `<div class="price">$${p.price} <small>/ ${p.unit||'件'}</small></div>`;
        if(inCart === 0){
          actionHtml = `<button class="btn primary" data-add="${p.id}" ${out?'disabled':''}>
                          ${out ? '售罄' : '＋ 加入'}
                        </button>`;
        }else{
          const plusDisabled = out ? 'disabled' : '';
          actionHtml = `<div class="stepper">
                          <button data-dec="${p.id}">－</button>
                          <span class="qty">${inCart}</span>
                          <button data-inc="${p.id}" ${plusDisabled}>＋</button>
                        </div>`;
        }
      }

      const card = document.createElement('div');
      card.className = 'card' + (out && inCart === 0 ? ' sold-out' : '');
      card.innerHTML = `
        <div class="name">${p.name}</div>
        ${priceHtml}
        ${stockHtml}
        <div class="card-action">${actionHtml}</div>
      `;
      productsEl.appendChild(card);
    });

    // 生豆分類底部：現場預購單專用「輸入金額」卡（開放金額，不占庫存）
    if(currentCat === 'beans'){
      const pre = document.createElement('div');
      pre.className = 'card preorder-card';
      pre.innerHTML = `
        <div class="name">預購商品</div>
        <div class="stock">現場填單・自訂金額</div>
        <div class="card-action">
          <button class="btn primary" data-preorder="1">＋ 輸入金額</button>
        </div>`;
      productsEl.appendChild(pre);
    }

    // 兩個分類底部都放「庫存修改」卡：開「展場商品庫存表」現場調整庫存＋填原因
    const se = document.createElement('div');
    se.className = 'card preorder-card';
    se.innerHTML = `
      <div class="name">庫存修改</div>
      <div class="stock">現場調整庫存・填原因</div>
      <div class="card-action">
        <button class="btn primary" data-stockedit="1">＋ 修改</button>
      </div>`;
    productsEl.appendChild(se);
  }

  /* ============================================================
     ⑦ 畫面：右側購物車
     ============================================================ */
  function renderCart(){
    const keys = Object.keys(cart);
    const miniEl = $('#cartMini');

    if(keys.length === 0){
      cartLinesEl.innerHTML = '<div class="cart-empty">尚未選擇商品<br>點左側「＋」開始點單</div>';
      cartTotalEl.textContent = '$0';
      miniEl.textContent = '0 件　$0';
      return;
    }

    let total = 0, count = 0;
    cartLinesEl.innerHTML = '';

    Object.entries(cart).forEach(([key, line]) => {
      const info = lineInfo(line);
      if(!info) return;
      const sub = info.price * line.qty;
      total += sub;
      count += line.qty;
      // 一般商品受庫存限制；預購（開放金額）不占庫存，可自由 ＋
      const plusDisabled = (!info.custom && availableStock(info.product) <= 0) ? 'disabled' : '';

      const nameHtml = info.isGift
        ? `<span class="c-name">${info.name} <span class="reason-chip">${line.reason}</span></span>
           <span class="c-sub gift">贈品</span>`
        : `<span class="c-name">${info.name}</span>
           <span class="c-sub">$${sub}</span>`;
      const unitNote = info.isGift
        ? `<span class="c-note">× ${line.qty}</span>`
        : `<span class="c-note">$${info.price} × ${line.qty}</span>`;

      const lineEl = document.createElement('div');
      lineEl.className = 'cart-line';
      lineEl.innerHTML = `
        ${nameHtml}
        <div class="c-controls">
          <div class="stepper">
            <button data-dec="${key}">－</button>
            <span class="qty">${line.qty}</span>
            <button data-inc="${key}" ${plusDisabled}>＋</button>
          </div>
          ${unitNote}
          <button class="c-remove" data-remove="${key}">移除</button>
        </div>
      `;
      cartLinesEl.appendChild(lineEl);
    });

    cartTotalEl.textContent = '$' + total.toLocaleString();
    miniEl.textContent = count + ' 件　$' + total.toLocaleString();
  }

  function cartTotalAmount(){
    return Object.values(cart).reduce((sum, line) => {
      const info = lineInfo(line);
      return sum + (info ? info.price * line.qty : 0);
    }, 0);
  }

  /* ============================================================
     ⑧ 動作：加入生豆 / 發放贈品 / 加減 / 移除 / 清空
     ============================================================ */
  function addBean(id){
    const p = products.find(x => x.id === id);
    if(!p || availableStock(p) <= 0) return;
    if(cart[id]) cart[id].qty++;
    else cart[id] = { id, qty:1, reason:'銷售' };
    refresh();
  }
  // 預購（開放金額）：每按一次跳出輸入框，店員填金額 → 成為一筆獨立項目
  let preorderSeq = 0;   // 給每筆預購一個唯一編號，避免不同金額被合併成同一行
  function addPreorder(){
    const input = prompt('請輸入預購金額（元）：');
    if(input === null) return;                 // 按了取消
    const amount = Number(input);
    if(!Number.isFinite(amount) || amount <= 0){
      showToast('請輸入大於 0 的金額', 'warn');
      return;
    }
    const key = 'preorder|' + (++preorderSeq);
    cart[key] = { id:'preorder', qty:1, reason:'預購', custom:true, name:'預購商品', price:Math.round(amount) };
    refresh();
  }
  function addGift(id, reason){
    const p = products.find(x => x.id === id);
    if(!p || availableStock(p) <= 0) return;
    const key = id + '|' + reason;
    if(cart[key]) cart[key].qty++;
    else cart[key] = { id, qty:1, reason };
    refresh();
  }
  function changeQty(key, delta){
    const line = cart[key];
    if(!line) return;
    const p = products.find(x => x.id === line.id);
    if(delta > 0 && availableStock(p) <= 0) return;
    line.qty += delta;
    if(line.qty <= 0) delete cart[key];
    refresh();
  }
  function removeLine(key){ delete cart[key]; refresh(); }

  function clearCart(){
    if(Object.keys(cart).length === 0) return;
    if(confirm('確定要清空這筆訂單嗎？')){
      cart = {};
      refresh();
    }
  }

  function refresh(){ renderProducts(); renderCart(); }

  /* ============================================================
     ⑨ 贈品「發放原因」選擇彈窗
     ============================================================ */
  function openReason(id){
    const p = products.find(x => x.id === id);
    if(!p || availableStock(p) <= 0) return;
    pendingGiftId = id;
    $('#reasonProductName').textContent = '發放：' + p.name;
    $('#reasonOverlay').classList.add('show');
  }
  function closeReason(){
    $('#reasonOverlay').classList.remove('show');
    pendingGiftId = null;
  }
  function chooseReason(reason){
    if(pendingGiftId) addGift(pendingGiftId, reason);
    closeReason();
  }

  /* ============================================================
     ⑩ 結帳：彈窗確認 → 記到本機
     ============================================================ */
  function openCheckout(){
    if(Object.keys(cart).length === 0){
      showToast('購物車是空的', 'warn');
      return;
    }
    const linesEl = $('#modalLines');
    linesEl.innerHTML = '';
    let giftCount = 0;

    Object.values(cart).forEach(line => {
      const info = lineInfo(line);
      if(!info) return;
      const row = document.createElement('div');
      row.className = 'modal-line';
      if(info.isGift){
        giftCount += line.qty;
        row.innerHTML = `
          <span>${info.name} <span class="reason-chip">${line.reason}</span> <span class="m-qty">× ${line.qty}</span></span>
          <span class="gift">贈品</span>`;
      }else{
        const sub = info.price * line.qty;
        row.innerHTML = `
          <span>${info.name} <span class="m-qty">$${info.price} × ${line.qty}</span></span>
          <span>$${sub}</span>`;
      }
      linesEl.appendChild(row);
    });

    if(giftCount > 0){
      const note = document.createElement('div');
      note.className = 'modal-note';
      note.textContent = `（含贈品 ${giftCount} 件，不計入金額）`;
      linesEl.appendChild(note);
    }

    const total = cartTotalAmount();
    $('#modalTotal').textContent = '$' + total.toLocaleString();
    setupPosBox(total);
    $('#overlay').classList.add('show');
  }
  function closeCheckout(){ $('#overlay').classList.remove('show'); }

  // 依應收金額準備 POS 區（付款方式/找零/發票）
  function setupPosBox(total){
    const posBox = $('#posBox');
    posBox.hidden = (total <= 0);   // 純贈品（$0）訂單：整個 POS 區隱藏
    if(total <= 0) return;

    // 付款方式預設「付現」，顯示找零區
    selectedPayment = '付現';
    document.querySelectorAll('#payToggle .pay-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.pay === '付現'));
    $('#changeRow').hidden = false;

    // 折扣：每次開視窗都清空
    $('#discountInput').value = '';
    // 找零：清空收現，並依折扣（此時為 0）重算應收與找零
    $('#cashGiven').value = '';
    updateModalTotals();

    // 發票：預設不開；帶入記住的前段與下一個號碼
    $('#invoiceOn').checked = false;
    $('#invoiceBox').hidden = true;
    $('#invPrefix').value = localStorage.getItem(KEY_INV_PREFIX) || '';
    $('#invNo').value = localStorage.getItem(KEY_INV_NO) || '';
  }

  // 折扣金額：讀輸入框，取整數、不可為負、也不可超過總額
  function currentDiscount(){
    const total = cartTotalAmount();
    let d = Math.floor(Number($('#discountInput').value));
    if(!Number.isFinite(d) || d < 0) d = 0;
    return Math.min(d, total);   // 折扣最多只能折到 0 元，不會變負的
  }
  // 折扣後真正要收的金額
  function payableAmount(){
    return cartTotalAmount() - currentDiscount();
  }
  // 折扣改變時：更新「應收總額」「−$折扣」「原價提示」，並重算找零
  function updateModalTotals(){
    const total = cartTotalAmount();
    const discount = currentDiscount();
    // 應收總額顯示「折扣後」的金額
    $('#modalTotal').textContent = '$' + (total - discount).toLocaleString();
    $('#discountOut').textContent = '−$' + discount.toLocaleString();
    // 有折扣才顯示原價（劃掉），沒折扣就藏起來
    const orig = $('#modalTotalOrig');
    if(discount > 0){
      orig.hidden = false;
      orig.textContent = '原價 $' + total.toLocaleString();
    }else{
      orig.hidden = true;
    }
    updateChange();
  }

  // 找零 = 收現 − 折扣後應收
  function updateChange(){
    const total = payableAmount();
    const out = $('#changeDue');
    if(!$('#cashGiven').value){ out.textContent = '找零 $0'; out.classList.remove('short'); return; }
    const diff = Number($('#cashGiven').value) - total;
    if(diff < 0){ out.textContent = '不足 $' + Math.abs(diff).toLocaleString(); out.classList.add('short'); }
    else        { out.textContent = '找零 $' + diff.toLocaleString();        out.classList.remove('short'); }
  }

  // 號碼字串 +1，保留前導 0（非數字則原樣返回）
  function incNumStr(s){
    if(!s || isNaN(parseInt(s, 10))) return s;
    return String(parseInt(s, 10) + 1).padStart(s.length, '0');
  }

  // 送出 = 把每行寫進本機銷售紀錄（不連網）
  function submitOrder(){
    const now = new Date();
    const orderNo = formatOrderNo(now);
    const total = cartTotalAmount();

    // 訂單層的付款方式、發票、折扣（純贈品 $0 訂單不帶）
    let payment = '', invoice = '', discount = 0;
    if(total > 0){
      payment = selectedPayment;
      discount = currentDiscount();
      if($('#invoiceOn').checked){
        const prefix = $('#invPrefix').value.trim();
        const no = $('#invNo').value.trim();
        invoice = prefix + no;
        localStorage.setItem(KEY_INV_PREFIX, prefix);   // 記住前段
        if(no) localStorage.setItem(KEY_INV_NO, incNumStr(no)); // 後段自動 +1
      }
    }

    Object.values(cart).forEach(line => {
      const info = lineInfo(line);
      if(!info) return;
      const isG = info.isGift;
      sales.push({
        time: now.toLocaleString('zh-TW', { hour12:false }),
        orderNo,
        id: line.id,
        name: info.name,
        qty: line.qty,
        price: info.price,
        subtotal: info.price * line.qty,
        category: line.reason,           // 預購會標記為「預購」，方便對帳
        payment: isG ? '' : payment,    // 贈品不帶付款方式
        invoice: isG ? '' : invoice     // 贈品不帶發票
      });
    });

    // 折扣：另存成一筆「負金額」紀錄，跟著這張單。
    // 這樣營收、付款總額、CSV 都會自動扣掉，不用另外處理。
    if(discount > 0){
      sales.push({
        time: now.toLocaleString('zh-TW', { hour12:false }),
        orderNo,
        id: 'discount',
        name: '折扣',
        qty: 1,
        price: -discount,
        subtotal: -discount,
        category: '折扣',          // 特別標記，統計時排除在贈品之外
        payment: payment,          // 跟著這張單的付款方式，付款總額才扣得對
        invoice: ''
      });
    }
    saveSales();
    recomputeRemaining();
    cart = {};
    closeCheckout();
    refresh();
    updateStats();
    showToast('已記錄（存在本機）', 'success');
  }

  /* ============================================================
     ⑪ 管理工具：匯出 CSV / 匯入商品 / 開新的一天 / 統計
     ============================================================ */
  // 訂單編號：用日期時間，方便人看（例 20260604-143015）
  function formatOrderNo(d){
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }
  function todayStamp(){
    const d = new Date(), p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
  }

  // CSV 單格：含逗號/引號/換行就用雙引號包起來
  function csvCell(v){
    const s = String(v ?? '');
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCSV(){
    if(sales.length === 0 && adjustments.length === 0){ showToast('目前沒有紀錄可匯出', 'warn'); return; }
    const header = ['時間','訂單編號','品項id','品名','數量','單價','小計','類別','付款方式','發票號碼'];
    const rows = sales.map(s => [s.time, s.orderNo, s.id, s.name, s.qty, s.price, s.subtotal, s.category, s.payment || '', s.invoice || '']);

    // 表格最後附上「付款方式總計」：空一行 → 標題 → 每種付款方式一行 → 營收合計
    const totals = paymentTotals();
    const revenue = sales.reduce((sum, s) => sum + Number(s.subtotal), 0);
    const summary = [
      [],                         // 空一行，跟明細隔開
      ['付款方式總計'],
      ...PAYMENT_METHODS.map(m => [m, totals[m]]),
      ['營收合計', revenue],
    ];

    // 再附上「庫存調整紀錄」（現場改庫存＋原因），方便對帳
    if(adjustments.length){
      summary.push([], ['庫存調整紀錄'], ['時間','品項id','品名','調整前','調整後','增減','原因']);
      adjustments.forEach(a =>
        summary.push([a.time, a.id, a.name, a.before, a.after, (a.delta > 0 ? '+' : '') + a.delta, a.reason]));
    }

    const csv = [header, ...rows, ...summary].map(r => r.map(csvCell).join(',')).join('\r\n');
    // 前面加 BOM(﻿)，Excel 開中文才不會亂碼
    const blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `萬友銷售_${todayStamp()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已匯出 CSV', 'success');
  }

  // 匯入商品 CSV（格式同 試算表匯入/商品.csv）：id,cat,品名,單價,單位,庫存總量,低庫存門檻
  function importProductsCSV(file){
    const reader = new FileReader();
    reader.onload = e => {
      try{
        const text = String(e.target.result).replace(/^﻿/, ''); // 去掉 BOM
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
        const next = [];
        // 第一列是標題，從第二列開始讀
        for(let i = 1; i < lines.length; i++){
          const c = lines[i].split(',');
          if(!c[0]) continue;
          next.push({
            id: c[0].trim(),
            cat: (c[1]||'beans').trim(),
            name: (c[2]||'').trim(),
            price: Number(c[3]) || 0,
            unit: (c[4]||'').trim() || (((c[1]||'').trim()==='gift') ? '個' : '件'),
            stock: Number(c[5]) || 0,
            lowAt: Number(c[6]) || 5
          });
        }
        if(next.length === 0){ showToast('CSV 沒有讀到商品，請檢查格式', 'warn'); return; }
        products = next;
        saveProducts();
        recomputeRemaining();
        refresh();
        showToast(`已匯入 ${next.length} 項商品`, 'success');
      }catch(err){
        console.error(err);
        showToast('匯入失敗，請確認是商品 CSV', 'warn');
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  function newDay(){
    if(!confirm('開新的一天？\n• 會先把今天的訂單自動匯出成 CSV 備份\n• 庫存「沿用」目前剩餘（不會回滿）\n• 清空今日訂單，筆數/營收歸零')){
      return;
    }
    // ① 先自動備份今天（有資料才匯出）
    if(sales.length > 0) exportCSV();

    // ② 庫存沿用：把「目前剩餘」設為新的一天庫存起點
    recomputeRemaining();
    products.forEach(p => { p.stock = p.remaining; });
    saveProducts();

    // ③ 清空今日紀錄（此時 remaining = 新 stock = 昨日剩餘）
    sales = [];
    saveSales();
    adjustments = [];          // 庫存調整紀錄也一起歸零（已隨上面的 CSV 備份）
    saveAdjustments();
    recomputeRemaining();

    cart = {};
    refresh();
    updateStats();
    showToast('已開新的一天（庫存已沿用）', 'success');
  }

  // 補貨：列出所有商品，輸入要「增加」的數量
  function openRestock(){
    const listEl = $('#restockList');
    listEl.innerHTML = '';
    products.forEach(p => {
      const unit = p.unit || (isGift(p) ? '個' : '件');
      const row = document.createElement('div');
      row.className = 'restock-row';
      row.innerHTML = `
        <span class="r-name">${p.name}</span>
        <span class="r-now">剩 ${p.remaining ?? 0} ${unit}</span>
        <input type="number" class="r-add" data-id="${p.id}" min="0" inputmode="numeric" placeholder="+0" />
      `;
      listEl.appendChild(row);
    });
    $('#restockOverlay').classList.add('show');
  }
  function closeRestock(){ $('#restockOverlay').classList.remove('show'); }

  function confirmRestock(){
    let changed = 0;
    document.querySelectorAll('#restockList .r-add').forEach(input => {
      const n = Math.floor(Number(input.value));
      if(n > 0){
        const p = products.find(x => x.id === input.dataset.id);
        if(p){ p.stock = Number(p.stock) + n; changed++; }
      }
    });
    if(changed === 0){ showToast('沒有輸入要補的數量', 'warn'); return; }
    saveProducts();
    recomputeRemaining();
    refresh();
    updateStats();
    closeRestock();
    showToast(`已補貨 ${changed} 項`, 'success');
  }

  /* ============================================================
     ⑪-a 庫存修改：展場商品庫存表（直接改數量＋填原因）
     ============================================================
     跟「補貨」不同：補貨只能加，這裡可以把庫存「改成任何數字」，
     用於盤點更正／破損／內部取用。每次修改都會存進 adjustments 紀錄。 */
  function openStockEdit(){
    const listEl = $('#stockEditList');
    listEl.innerHTML = '';
    products.forEach(p => {
      const unit = p.unit || (isGift(p) ? '個' : '件');
      const cur = p.remaining ?? 0;
      const row = document.createElement('div');
      row.className = 'restock-row';
      // 輸入框「預設帶入目前庫存」，店員直接改成正確數字即可
      row.innerHTML = `
        <span class="r-name">${p.name}</span>
        <span class="r-now">目前 ${cur} ${unit}</span>
        <input type="number" class="se-input" data-id="${p.id}" min="0" inputmode="numeric" value="${cur}" />
      `;
      listEl.appendChild(row);
    });
    $('#stockEditReason').value = '';
    $('#stockEditOverlay').classList.add('show');
  }
  function closeStockEdit(){ $('#stockEditOverlay').classList.remove('show'); }

  function confirmStockEdit(){
    const reason = $('#stockEditReason').value.trim();
    // 先挑出「有改過」且有效的項目
    const changes = [];
    document.querySelectorAll('#stockEditList .se-input').forEach(input => {
      const p = products.find(x => x.id === input.dataset.id);
      if(!p) return;
      const before = p.remaining ?? 0;
      const after = Math.floor(Number(input.value));
      if(!Number.isFinite(after) || after < 0) return;  // 空白/負數/亂填 → 跳過
      if(after === before) return;                       // 沒改 → 跳過
      changes.push({ p, before, after });
    });

    if(changes.length === 0){ showToast('沒有需要修改的庫存', 'warn'); return; }
    if(!reason){ showToast('請填寫調整原因', 'warn'); return; }

    const now = new Date();
    const timeStr = now.toLocaleString('zh-TW', { hour12:false });
    changes.forEach(({ p, before, after }) => {
      // 已賣出數量固定，改「庫存總量」讓剩餘 = 店員填的數字
      const sold = Number(p.stock) - before;   // sold = 原庫存總量 − 目前剩餘
      p.stock = after + sold;                   // 新庫存總量，recompute 後剩餘就會 = after
      adjustments.push({
        time: timeStr, id: p.id, name: p.name,
        before, after, delta: after - before, reason
      });
    });

    saveProducts();
    saveAdjustments();
    recomputeRemaining();
    refresh();
    updateStats();
    closeStockEdit();
    showToast(`已修改 ${changes.length} 項庫存`, 'success');
  }

  /* ============================================================
     ⑪-b 訂單紀錄：查看 / 改付款方式 / 刪除整筆
     ============================================================
     銷售紀錄 sales 是「一個品項一筆」，同一張單靠 orderNo 綁在一起。
     這裡把它們「照 orderNo 分組」還原成一張張訂單來顯示。            */

  // 把 sales 依 orderNo 分組成訂單陣列（最新的排最前面）
  function getOrders(){
    const map = {};
    sales.forEach(s => {
      if(!map[s.orderNo]){
        map[s.orderNo] = { orderNo:s.orderNo, time:s.time, lines:[], total:0, payment:'', invoice:'' };
      }
      const o = map[s.orderNo];
      o.lines.push(s);
      o.total += Number(s.subtotal);
      if(s.payment) o.payment = s.payment;   // 取這張單的付款方式（贈品行為空，會略過）
      if(s.invoice) o.invoice = s.invoice;
    });
    // Object.values 會照「加入順序」，reverse 讓最新一筆排最上面
    return Object.values(map).reverse();
  }

  let pendingPayEditOrderNo = null;   // 暫存：正在修改付款方式的訂單編號

  function openOrders(){
    renderOrders();
    $('#ordersOverlay').classList.add('show');
  }
  function closeOrders(){ $('#ordersOverlay').classList.remove('show'); }

  // 畫出訂單紀錄視窗的內容（付款小計 + 訂單清單）
  function renderOrders(){
    // ① 上方：各付款方式小計
    const totals = paymentTotals();
    const sumEl = $('#ordersSummary');
    sumEl.innerHTML = PAYMENT_METHODS.map(m =>
      `<div class="sum-item">
         <span class="sum-label">${m}</span>
         <span class="sum-amount">$${totals[m].toLocaleString()}</span>
       </div>`).join('');

    // ② 下方：訂單清單
    const orders = getOrders();
    const listEl = $('#ordersList');
    if(orders.length === 0){
      listEl.innerHTML = '<div class="cart-empty">今天還沒有訂單</div>';
      return;
    }

    listEl.innerHTML = '';
    orders.forEach(o => {
      // 品項摘要：品名 ×數量，用頓號隔開
      const itemsText = o.lines
        .map(l => `${l.name} ×${l.qty}`)
        .join('、');
      // 只取「時分秒」讓畫面清爽（time 例：2026/7/11 下午2:30:15）
      const timeShort = o.orderNo.split('-')[1]
        ? o.orderNo.split('-')[1].replace(/(\d{2})(\d{2})(\d{2})/, '$1:$2:$3')
        : o.time;
      const isGiftOnly = o.total <= 0;   // 純贈品單：沒有付款方式，不能改付款
      const payHtml = isGiftOnly
        ? `<span class="ord-pay gift">純贈品</span>`
        : `<span class="ord-pay">${o.payment || '—'}</span>`;
      const invHtml = o.invoice ? `<span class="ord-inv">發票 ${o.invoice}</span>` : '';

      const row = document.createElement('div');
      row.className = 'order-card';
      row.innerHTML = `
        <div class="ord-head">
          <span class="ord-time">${timeShort}</span>
          ${payHtml}
          <span class="ord-total">$${o.total.toLocaleString()}</span>
        </div>
        <div class="ord-items">${itemsText}</div>
        <div class="ord-foot">
          ${invHtml}
          <div class="ord-actions">
            ${isGiftOnly ? '' : `<button class="btn-sm" data-payedit="${o.orderNo}">改付款方式</button>`}
            <button class="btn-sm danger-text" data-delorder="${o.orderNo}">刪除</button>
          </div>
        </div>
      `;
      listEl.appendChild(row);
    });
  }

  // 刪除整筆訂單：把該 orderNo 的所有品項行都移除，庫存自動回補
  function deleteOrder(orderNo){
    const order = getOrders().find(o => o.orderNo === orderNo);
    if(!order) return;
    if(!confirm(`確定刪除這筆訂單嗎？\n金額 $${order.total.toLocaleString()}\n刪除後庫存會自動加回，且無法復原。`)){
      return;
    }
    sales = sales.filter(s => s.orderNo !== orderNo);
    saveSales();
    recomputeRemaining();   // 賣出數量減少 → 剩餘自動加回
    refresh();
    updateStats();
    renderOrders();         // 視窗留著，重畫清單
    showToast('已刪除該筆訂單', 'success');
  }

  // 開啟「修改付款方式」小視窗
  function openPayEdit(orderNo){
    const order = getOrders().find(o => o.orderNo === orderNo);
    if(!order || order.total <= 0) return;   // 純贈品單不給改
    pendingPayEditOrderNo = orderNo;
    $('#payEditInfo').textContent = `金額 $${order.total.toLocaleString()}　目前：${order.payment || '—'}`;
    // 標記目前的付款方式（讓店員看得出原本是哪個）
    document.querySelectorAll('#payEditOptions .reason-btn').forEach(b =>
      b.classList.toggle('current', b.dataset.pay === order.payment));
    $('#payEditOverlay').classList.add('show');
  }
  function closePayEdit(){
    $('#payEditOverlay').classList.remove('show');
    pendingPayEditOrderNo = null;
  }
  // 套用新的付款方式：把該訂單「原本有付款方式」的品項行都改成新的（贈品行維持空）
  function applyPayEdit(newPay){
    if(!pendingPayEditOrderNo) return;
    let changed = false;
    sales.forEach(s => {
      if(s.orderNo === pendingPayEditOrderNo && s.payment){
        s.payment = newPay;
        changed = true;
      }
    });
    if(changed){
      saveSales();
      updateStats();
      renderOrders();
      showToast(`付款方式已改為「${newPay}」`, 'success');
    }
    closePayEdit();
  }

  // 各付款方式收了多少：把每筆銷售的小計，依它的付款方式累加
  //   回傳像 { '付現':1200, '刷卡':500, 'LINE Pay':0, '匯款':0 }
  function paymentTotals(){
    const totals = {};
    PAYMENT_METHODS.forEach(m => totals[m] = 0);   // 先全部歸 0，確保四種都在
    sales.forEach(s => {
      // 贈品的 payment 是空字串，會被跳過；只算有付款方式的
      if(s.payment && totals[s.payment] !== undefined){
        totals[s.payment] += Number(s.subtotal);
      }
    });
    return totals;
  }

  // 把付款總額組成一行字：只列出「有金額」的方式（例：付現 $1,200 · 刷卡 $500）
  function paymentSummaryText(){
    const totals = paymentTotals();
    const parts = PAYMENT_METHODS
      .filter(m => totals[m] > 0)
      .map(m => `${m} $${totals[m].toLocaleString()}`);
    return parts.length ? parts.join('　·　') : '尚無收款';
  }

  // 工具列統計：訂單筆數（不同訂單編號）＋ 贈品件數 ＋ 營收（小計加總）
  function updateStats(){
    const orderNos = new Set(sales.map(s => s.orderNo));
    // 贈品件數：排除「銷售 / 預購 / 折扣」，剩下的才是真正發放的贈品
    const NON_GIFT_CATS = ['銷售', '預購', '折扣'];
    const giftQty = sales.reduce((sum, s) => sum + (NON_GIFT_CATS.includes(s.category) ? 0 : Number(s.qty)), 0);
    const revenue = sales.reduce((sum, s) => sum + Number(s.subtotal), 0);
    $('#toolbarStats').textContent =
      `訂單 ${orderNos.size} 筆 · 贈品 ${giftQty} 件 · 營收 $${revenue.toLocaleString()}`;
    // 第二行：各付款方式小計
    $('#payStats').textContent = paymentSummaryText();
  }

  /* ============================================================
     ⑫ 小工具：Toast、事件綁定、PWA 註冊
     ============================================================ */
  let toastTimer;
  function showToast(msg, type){
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function bindEvents(){
    // 分類頁籤
    $('#tabs').addEventListener('click', e => {
      const btn = e.target.closest('.tab');
      if(!btn) return;
      currentCat = btn.dataset.cat;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
      renderProducts();
    });

    // 商品區（加入生豆 / 發放贈品 / 加 / 減）
    productsEl.addEventListener('click', e => {
      const t = e.target;
      if(t.dataset.add) addBean(t.dataset.add);
      else if(t.dataset.preorder) addPreorder();
      else if(t.dataset.stockedit) openStockEdit();
      else if(t.dataset.give) openReason(t.dataset.give);
      else if(t.dataset.inc) changeQty(t.dataset.inc, 1);
      else if(t.dataset.dec) changeQty(t.dataset.dec, -1);
    });

    // 購物車區（加 / 減 / 移除）——這裡的鍵是 lineKey
    cartLinesEl.addEventListener('click', e => {
      const t = e.target;
      if(t.dataset.inc) changeQty(t.dataset.inc, 1);
      else if(t.dataset.dec) changeQty(t.dataset.dec, -1);
      else if(t.dataset.remove) removeLine(t.dataset.remove);
    });

    // 清空 / 結帳
    $('#clearBtn').addEventListener('click', clearCart);
    $('#checkoutBtn').addEventListener('click', openCheckout);

    // 結帳彈窗
    $('#modalCancel').addEventListener('click', closeCheckout);
    $('#modalConfirm').addEventListener('click', submitOrder);
    $('#overlay').addEventListener('click', e => {
      if(e.target.id === 'overlay') closeCheckout();
    });

    // POS：付款方式切換（付現/刷卡）
    $('#payToggle').addEventListener('click', e => {
      const btn = e.target.closest('.pay-btn');
      if(!btn) return;
      selectedPayment = btn.dataset.pay;
      document.querySelectorAll('#payToggle .pay-btn').forEach(b =>
        b.classList.toggle('active', b === btn));
      $('#changeRow').hidden = (selectedPayment !== '付現'); // 只有付現顯示找零
    });
    // POS：折扣輸入 → 即時重算應收與找零
    $('#discountInput').addEventListener('input', updateModalTotals);
    // POS：收現輸入 → 即時算找零
    $('#cashGiven').addEventListener('input', updateChange);
    // POS：開發票勾選 → 顯示/隱藏發票兩格
    $('#invoiceOn').addEventListener('change', e => {
      $('#invoiceBox').hidden = !e.target.checked;
    });

    // 贈品原因彈窗
    $('#reasonOptions').addEventListener('click', e => {
      const btn = e.target.closest('[data-reason]');
      if(btn) chooseReason(btn.dataset.reason);
    });
    $('#reasonCancel').addEventListener('click', closeReason);
    $('#reasonOverlay').addEventListener('click', e => {
      if(e.target.id === 'reasonOverlay') closeReason();
    });

    // 管理工具列
    $('#exportBtn').addEventListener('click', exportCSV);
    $('#newDayBtn').addEventListener('click', newDay);
    $('#importBtn').addEventListener('click', () => $('#importFile').click());
    $('#importFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if(file) importProductsCSV(file);
      e.target.value = '';   // 清掉，才能再次選同一個檔
    });

    // 補貨彈窗
    $('#restockBtn').addEventListener('click', openRestock);
    $('#restockCancel').addEventListener('click', closeRestock);
    $('#restockConfirm').addEventListener('click', confirmRestock);
    $('#restockOverlay').addEventListener('click', e => {
      if(e.target.id === 'restockOverlay') closeRestock();
    });

    // 庫存修改彈窗（展場商品庫存表）——由商品區的「庫存修改」卡開啟
    $('#stockEditCancel').addEventListener('click', closeStockEdit);
    $('#stockEditConfirm').addEventListener('click', confirmStockEdit);
    $('#stockEditOverlay').addEventListener('click', e => {
      if(e.target.id === 'stockEditOverlay') closeStockEdit();
    });

    // 訂單紀錄彈窗
    $('#ordersBtn').addEventListener('click', openOrders);
    $('#ordersClose').addEventListener('click', closeOrders);
    $('#ordersOverlay').addEventListener('click', e => {
      if(e.target.id === 'ordersOverlay') closeOrders();
    });
    // 清單內的「改付款方式 / 刪除」——用事件委派抓 data 屬性
    $('#ordersList').addEventListener('click', e => {
      const t = e.target;
      if(t.dataset.payedit) openPayEdit(t.dataset.payedit);
      else if(t.dataset.delorder) deleteOrder(t.dataset.delorder);
    });

    // 修改付款方式小視窗
    $('#payEditOptions').addEventListener('click', e => {
      const btn = e.target.closest('[data-pay]');
      if(btn) applyPayEdit(btn.dataset.pay);
    });
    $('#payEditCancel').addEventListener('click', closePayEdit);
    $('#payEditOverlay').addEventListener('click', e => {
      if(e.target.id === 'payEditOverlay') closePayEdit();
    });

    // 手機版購物車展開/收合
    $('#cartToggle').addEventListener('click', () => {
      const cartEl = $('#cart');
      cartEl.classList.toggle('collapsed');
      $('#cartToggle').textContent = cartEl.classList.contains('collapsed') ? '展開明細' : '收合';
    });
  }

  // 註冊 service worker（PWA 離線快取）。file:// 開啟時會略過，不影響功能。
  function registerServiceWorker(){
    if('serviceWorker' in navigator && location.protocol.startsWith('http')){
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW 註冊失敗：', err));
    }
  }

  // 出發！
  init();
  </script>
</body>
</html>
